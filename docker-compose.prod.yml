version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: arewamart_db_prod
    restart: always
    environment:
      POSTGRES_DB: arewamart
      POSTGRES_USER: arewamart_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-arewamart_secure_password_change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - arewamart_pgdata_prod:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # Only accessible locally
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arewamart_user -d arewamart"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arewamart_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: arewamart_app_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://arewamart_user:${DB_PASSWORD:-arewamart_secure_password_change_me}@db:5432/arewamart
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
    ports:
      - "127.0.0.1:3000:3000"  # Only accessible locally via Nginx
    expose:
      - 3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - arewamart_network
    command: >
      sh -c "npx prisma migrate deploy &&
             npx prisma db seed &&
             npm run start"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  arewamart_pgdata_prod:
    driver: local

networks:
  arewamart_network:
    driver: bridge
